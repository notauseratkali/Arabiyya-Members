<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arabiyya Members</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <meta name="description" content="Arabiyya Members - Membership, attendance, and investiture management system for Arabiyya Rover Network (Arabiyya Rovers)." />
    <meta property="og:title" content="Arabiyya Members" />
    <meta property="og:description" content="Arabiyya Members - Membership, attendance, and investiture management system for Arabiyya Rover Network (Arabiyya Rovers)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        if (!document.querySelector('base')) {
          var path = window.location.pathname;
          var parts = path.split('/').filter(Boolean);
          var knownRoutes = [
            'signin', 'login', 'join', 'signup', 'forgot-password', 'track', 'policy',
            'dashboard', 'events', 'attendance', 'meeting-minutes', 'profile',
            'members', 'courses', 'logbook', 'log-book', 'progress', 'finance',
            'syllabus', 'requests', 'announcements', 'settings', 'admin', '404', 'index.html'
          ];
          var baseHref = '/';
          if (window.location.hostname.indexOf('github.io') !== -1 && parts.length > 0 && !knownRoutes.includes(parts[0])) {
            baseHref = '/' + parts[0] + '/';
          }
          var baseEl = document.createElement('base');
          baseEl.href = window.location.origin + baseHref;
          document.head.insertBefore(baseEl, document.head.firstChild);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
