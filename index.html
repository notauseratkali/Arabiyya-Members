    <script>
      // Single Page Apps for GitHub Pages and static hosts
      // MIT License https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.search.indexOf('p=/') !== -1) {
          var match = l.search.match(/[?&]p=([^&]*)/);
          if (match && match[1]) {
            var newPath = decodeURIComponent(match[1]).replace(/~and~/g, '&');
            window.history.replaceState(null, null, newPath + l.hash);
          }
        }
      }(window.location))
    </script>
