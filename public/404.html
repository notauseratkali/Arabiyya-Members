<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arabiyya Members</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Keeps the path and forwards to index.html with query or hash
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Find repo name if hosted on *.github.io/<repo>
        var segments = path.split('/').filter(Boolean);
        var repo = '';
        if (window.location.hostname.endsWith('github.io') && segments.length > 0) {
          repo = '/' + segments[0];
          // Strip repo prefix from the route to keep
          path = '/' + segments.slice(1).join('/');
        }
        
        var target = (repo || '') + '/?p=' + encodeURIComponent(path + (search ? search : '') + (hash ? hash : ''));
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="background:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p style="color:#64748b;font-size:14px;font-weight:600;">Loading Arabiyya Rovers...</p>
  </body>
</html>
