name: Deploy to GitHub Pages

# Owner step (cannot be committed): GitHub → Settings → Pages → Build and deployment
# → Source: GitHub Actions. While Source stays "Deploy from a branch", GitHub also
# runs its own publisher and the two deploys race. This workflow is the only deploy.

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build project
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository variable (Settings → Secrets and variables → Actions → Variables).
          # Empty until the API host exists. The client then errors instead of calling a dead host.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
